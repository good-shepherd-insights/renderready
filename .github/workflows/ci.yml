name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-progress run of the same ref pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Chromium is installed explicitly where it is needed, so keep it out of
  # every other `npm ci`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  static:
    name: Lint, types and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      # Catches a broken `exports` map or mistyped dual-format output, which
      # unit tests cannot see because they import from src.
      - run: npm run check:packaging

  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  integration:
    name: Integration tests (real Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --with-deps pulls the system libraries Chromium needs on a bare runner.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: renderready:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Proves the image actually serves a render, not merely that it builds.
      - name: Smoke test the image
        run: |
          docker run -d --name renderready -p 3000:3000 --shm-size=1g renderready:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo "Health check never passed. Container logs:"
              docker logs renderready
              exit 1
            fi
            sleep 2
          done
          curl -fsS 'http://localhost:3000/render?url=https%3A%2F%2Fexample.com%2F' \
            | tee /tmp/rendered.html > /dev/null
          grep -q 'Example Domain' /tmp/rendered.html
          if grep -qi '<script' /tmp/rendered.html; then
            echo 'Scripts were not stripped from the rendered output'
            exit 1
          fi
          echo 'Rendered and script-free.'
      - name: Container logs
        if: always()
        run: docker logs renderready || true
